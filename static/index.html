<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkySearch Flights</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">✈️ SkySearch</div>
    </header>

    <main class="main-container">
        <!-- Search Hero Section -->
        <section class="search-hero">
            <h1>Where to next?</h1>
            <form id="search-form" class="search-box">
                <div class="input-group">
                    <label>From</label>
                    <input type="text" id="from_airport" placeholder="JFK" required>
                </div>
                <div class="divider"></div>
                <div class="input-group">
                    <label>To</label>
                    <input type="text" id="to_airport" placeholder="LHR" required>
                </div>
                <div class="divider"></div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="divider"></div>
                <div class="input-group">
                    <label>Travelers</label>
                    <input type="number" id="adults" min="1" value="1" required>
                </div>
                <div class="divider"></div>
                <div class="input-group">
                    <label>Class</label>
                    <select id="seat">
                        <option value="economy">Economy</option>
                        <option value="business">Business</option>
                        <option value="first">First</option>
                    </select>
                </div>
                <button type="submit" id="search-btn" class="btn-primary">
                    <span class="btn-text">Search</span>
                    <div class="spinner hidden"></div>
                </button>
            </form>
        </section>

        <!-- Main Content Area -->
        <section class="content-area">
            <aside id="filter-panel" class="sidebar hidden">
                <h3>Filters & Sort</h3>
                
                <div class="filter-group">
                    <label>Sort By</label>
                    <select id="sort-by">
                        <option value="price_asc">Price (Lowest)</option>
                        <option value="price_desc">Price (Highest)</option>
                        <option value="duration_asc">Duration (Shortest)</option>
                        <option value="duration_desc">Duration (Longest)</option>
                        <option value="departure_asc">Departure (Earliest)</option>
                        <option value="departure_desc">Departure (Latest)</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Max Price: <span id="price-val" class="val-badge">Any</span></label>
                    <input type="range" id="max-price" min="0" max="50000" step="500" value="50000">
                </div>

                <div class="filter-group">
                    <label>Max Duration: <span id="duration-val" class="val-badge">Any</span></label>
                    <input type="range" id="max-duration" min="0" max="2400" step="30" value="2400">
                </div>

                <div class="filter-group">
                    <label>Airline</label>
                    <select id="filter-airline">
                        <option value="any">All Airlines</option>
                    </select>
                </div>
            </aside>

            <div class="results-wrapper">
                <div id="results-container" class="results-container hidden">
                    <!-- Flights injected here -->
                </div>
            </div>
        </section>
    </main>

    <script src="/static/script.js?v=3"></script>
</body>
</html>
